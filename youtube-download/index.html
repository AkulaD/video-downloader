<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="row">
            <div class="left">
                <h1>Downloader</h1>
            </div>
            <div class="right">
                <ul>
                    <li><a href="../instagram-download/index.html">Instagram</a></li>
                    <li><a href="../tiktok-download/index.html">Tiktok</a></li>
                    <li class="active">Youtube</li>
                </ul>
            </div>
        </div>
    </header>
    
    <main>
        <div class="content">
            <h1>Tiktok Downloader</h1>
            <div class="input-wrapper">
                <input type="text" id="videoLink" placeholder="Paste Link Here">
                <span class="divider">|</span>
                <img src="paste.png" alt="paste" id="pasteBtn">
            </div>
            <button id="downloadVideo">Download Video</button>
            <button id="downloadAudio">Download MP3</button>

            <div class="preview" id="previewSection">
                <!-- Konten video akan muncul di sini melalui JS -->
            </div>
        </div>
    </main>
</body>
</html>
